<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #10b981;
            --danger: #ef4444;
            --background: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .input-section {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            border-color: var(--primary);
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .add-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .filters {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .filter-btn:hover {
            background: var(--background);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .task-list {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.2s;
        }

        .task-item:hover {
            background: var(--background);
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            transition: all 0.2s;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #6b7280;
        }

        .task-date {
            font-size: 12px;
            color: #6b7280;
            margin-right: 12px;
        }

        .delete-btn {
            padding: 6px 12px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .footer {
            padding: 16px 24px;
            background: var(--background);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #6b7280;
        }

        .clear-completed {
            padding: 8px 16px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .clear-completed:hover {
            background: #059669;
        }

        .clear-completed:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #6b7280;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        @media (max-width: 640px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .input-container {
                flex-direction: column;
            }

            .task-input {
                width: 100%;
            }

            .add-btn {
                width: 100%;
            }

            .footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Todo App</h1>
        </div>

        <div class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力..." 
                    maxlength="100"
                    aria-label="新しいタスクを入力"
                >
                <button class="add-btn" type="button" aria-label="タスクを追加">追加</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">全て</button>
            <button class="filter-btn" data-filter="active">未完了</button>
            <button class="filter-btn" data-filter="completed">完了済み</button>
        </div>

        <div class="task-list" id="taskList">
            <div class="empty-state">
                <h3>タスクがありません</h3>
                <p>上記の入力フィールドから新しいタスクを追加してください</p>
            </div>
        </div>

        <div class="footer">
            <span class="task-count">残り: <span id="activeCount">0</span>件</span>
            <button class="clear-completed" id="clearCompleted" disabled>完了済みを削除</button>
        </div>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.nextId = this.getNextId();
                
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.taskList = document.getElementById('taskList');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.activeCount = document.getElementById('activeCount');
                this.clearCompletedBtn = document.getElementById('clearCompleted');
                
                this.init();
            }

            init() {
                this.addEventListeners();
                this.render();
            }

            addEventListeners() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
                this.taskInput.addEventListener('input', () => this.updateAddButton());

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompletedBtn.addEventListener('click', () => this.clearCompleted());
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.nextId++,
                    text: text,
                    completed: false,
                    createdAt: new Date()
                };

                this.tasks.unshift(task);
                this.taskInput.value = '';
                this.updateAddButton();
                this.saveTasks();
                this.render();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            setFilter(filter) {
                this.currentFilter = filter;
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.render();
            }

            clearCompleted() {
                this.tasks = this.tasks.filter(task => !task.completed);
                this.saveTasks();
                this.render();
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(task => !task.completed);
                    case 'completed':
                        return this.tasks.filter(task => task.completed);
                    default:
                        return this.tasks;
                }
            }

            updateAddButton() {
                const hasText = this.taskInput.value.trim().length > 0;
                this.addBtn.disabled = !hasText;
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(task => !task.completed);
                const completedTasks = this.tasks.filter(task => task.completed);

                // タスク数更新
                this.activeCount.textContent = activeTasks.length;

                // 完了済み削除ボタン更新
                this.clearCompletedBtn.disabled = completedTasks.length === 0;

                // タスクリスト更新
                if (filteredTasks.length === 0) {
                    let emptyMessage = 'タスクがありません';
                    if (this.currentFilter === 'active' && this.tasks.length > 0) {
                        emptyMessage = '未完了のタスクがありません';
                    } else if (this.currentFilter === 'completed' && this.tasks.length > 0) {
                        emptyMessage = '完了済みのタスクがありません';
                    }

                    this.taskList.innerHTML = `
                        <div class="empty-state">
                            <h3>${emptyMessage}</h3>
                            <p>上記の入力フィールドから新しいタスクを追加してください</p>
                        </div>
                    `;
                } else {
                    this.taskList.innerHTML = filteredTasks.map(task => `
                        <div class="task-item slide-in">
                            <input 
                                type="checkbox" 
                                class="task-checkbox" 
                                ${task.completed ? 'checked' : ''}
                                onchange="todoApp.toggleTask(${task.id})"
                                aria-label="タスクの完了状態を切り替え"
                            >
                            <span class="task-text ${task.completed ? 'completed' : ''}">${this.escapeHtml(task.text)}</span>
                            <span class="task-date">${this.formatDate(task.createdAt)}</span>
                            <button 
                                class="delete-btn" 
                                onclick="todoApp.deleteTask(${task.id})"
                                aria-label="タスクを削除"
                            >削除</button>
                        </div>
                    `).join('');
                }
            }

            formatDate(date) {
                const d = new Date(date);
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                return `${month}/${day} ${hours}:${minutes}`;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    if (stored) {
                        const tasks = JSON.parse(stored);
                        return tasks.map(task => ({
                            ...task,
                            createdAt: new Date(task.createdAt)
                        }));
                    }
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                }
                return [];
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                }
            }

            getNextId() {
                return this.tasks.length > 0 ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
            }
        }

        // アプリケーション初期化
        const todoApp = new TodoApp();

        // キーボードナビゲーション対応
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                todoApp.taskInput.blur();
            }
        });
    </script>
</body>
</html>
