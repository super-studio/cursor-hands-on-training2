<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --transition: all 0.2s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #6366f1);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            outline: none;
        }

        .task-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            background: white;
            color: var(--text-color);
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .todo-list {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-item:hover {
            background: #f1f5f9;
        }

        .todo-item.completed {
            opacity: 0.7;
        }

        .todo-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .todo-text {
            flex: 1;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-btn {
            padding: 0.5rem;
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            border-radius: 4px;
            transition: var(--transition);
            font-size: 1.125rem;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.1);
        }

        .stats-section {
            padding: 1.5rem;
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-item {
            font-size: 0.875rem;
            color: #64748b;
        }

        .stat-number {
            font-weight: 700;
            color: var(--text-color);
        }

        .clear-completed-btn {
            padding: 0.5rem 1rem;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .clear-completed-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .clear-completed-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .empty-state p {
            font-size: 0.875rem;
        }

        /* レスポンシブデザイン */
        @media (max-width: 640px) {
            body {
                padding: 0.5rem;
            }

            .header {
                padding: 1.5rem 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-section {
                padding: 1rem;
            }

            .input-container {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .filters {
                justify-content: center;
            }

            .stats-section {
                flex-direction: column;
                text-align: center;
            }

            .stats {
                justify-content: center;
            }
        }

        /* アクセシビリティ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* フォーカス表示 */
        .task-input:focus,
        .add-btn:focus,
        .filter-btn:focus,
        .todo-checkbox:focus,
        .delete-btn:focus,
        .clear-completed-btn:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* ローディング状態 */
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        /* アニメーション */
        .fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Simple Todo App</h1>
            <p>効率的なタスク管理で生産性を向上させましょう</p>
        </header>

        <section class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..." 
                    aria-label="新しいタスクを入力"
                    maxlength="200"
                >
                <button class="add-btn" aria-label="タスクを追加">
                    ➕ 追加
                </button>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </section>

        <main class="todo-list" role="main" aria-label="タスクリスト">
            <!-- タスクがここに動的に追加されます -->
        </main>

        <footer class="stats-section">
            <div class="stats">
                <div class="stat-item">
                    合計: <span class="stat-number" id="total-count">0</span>件
                </div>
                <div class="stat-item">
                    未完了: <span class="stat-number" id="active-count">0</span>件
                </div>
                <div class="stat-item">
                    完了済み: <span class="stat-number" id="completed-count">0</span>件
                </div>
            </div>
            <button class="clear-completed-btn" disabled>
                🗑️ 完了済みを削除
            </button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.taskIdCounter = this.getNextId();
                
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            // DOM要素の初期化
            initializeElements() {
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.todoList = document.querySelector('.todo-list');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.clearCompletedBtn = document.querySelector('.clear-completed-btn');
                this.totalCount = document.getElementById('total-count');
                this.activeCount = document.getElementById('active-count');
                this.completedCount = document.getElementById('completed-count');
            }

            // イベントリスナーの設定
            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 入力フィールドの監視
                this.taskInput.addEventListener('input', () => {
                    this.addBtn.disabled = !this.taskInput.value.trim();
                });

                // フィルタリング
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済みタスクの一括削除
                this.clearCompletedBtn.addEventListener('click', () => {
                    this.clearCompleted();
                });

                // キーボードショートカット
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'a':
                                e.preventDefault();
                                this.setFilter('all');
                                break;
                            case 'u':
                                e.preventDefault();
                                this.setFilter('active');
                                break;
                            case 'd':
                                e.preventDefault();
                                this.setFilter('completed');
                                break;
                        }
                    }
                });
            }

            // タスクの追加
            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.taskIdCounter++,
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.push(task);
                this.taskInput.value = '';
                this.addBtn.disabled = true;
                this.saveTasks();
                this.render();

                // アクセシビリティ: 追加完了のお知らせ
                this.announceToScreenReader(`タスク「${text}」を追加しました`);
            }

            // タスクの削除
            deleteTask(id) {
                const taskIndex = this.tasks.findIndex(task => task.id === id);
                if (taskIndex === -1) return;

                const task = this.tasks[taskIndex];
                const taskElement = document.querySelector(`[data-task-id="${id}"]`);
                
                if (taskElement) {
                    taskElement.classList.add('fade-out');
                    setTimeout(() => {
                        this.tasks.splice(taskIndex, 1);
                        this.saveTasks();
                        this.render();
                        this.announceToScreenReader(`タスク「${task.text}」を削除しました`);
                    }, 300);
                }
            }

            // タスクの完了状態切り替え
            toggleTask(id) {
                const task = this.tasks.find(task => task.id === id);
                if (!task) return;

                task.completed = !task.completed;
                this.saveTasks();
                this.render();

                const status = task.completed ? '完了' : '未完了';
                this.announceToScreenReader(`タスク「${task.text}」を${status}にしました`);
            }

            // フィルターの設定
            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルターボタンのアクティブ状態更新
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });

                this.render();
            }

            // 完了済みタスクの一括削除
            clearCompleted() {
                const completedTasks = this.tasks.filter(task => task.completed);
                if (completedTasks.length === 0) return;

                if (confirm(`${completedTasks.length}件の完了済みタスクを削除しますか？`)) {
                    this.tasks = this.tasks.filter(task => !task.completed);
                    this.saveTasks();
                    this.render();
                    this.announceToScreenReader(`${completedTasks.length}件の完了済みタスクを削除しました`);
                }
            }

            // タスクのフィルタリング
            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(task => !task.completed);
                    case 'completed':
                        return this.tasks.filter(task => task.completed);
                    default:
                        return this.tasks;
                }
            }

            // 画面の描画
            render() {
                const filteredTasks = this.getFilteredTasks();
                
                // タスクリストの描画
                if (filteredTasks.length === 0) {
                    this.renderEmptyState();
                } else {
                    this.renderTasks(filteredTasks);
                }

                // 統計情報の更新
                this.updateStats();
            }

            // タスクリストの描画
            renderTasks(tasks) {
                this.todoList.innerHTML = tasks.map(task => `
                    <div class="todo-item ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
                        <input 
                            type="checkbox" 
                            class="todo-checkbox" 
                            ${task.completed ? 'checked' : ''}
                            onchange="todoApp.toggleTask(${task.id})"
                            aria-label="タスクの完了状態を切り替え"
                        >
                        <span 
                            class="todo-text ${task.completed ? 'completed' : ''}"
                            onclick="todoApp.toggleTask(${task.id})"
                            title="クリックで完了状態を切り替え"
                        >
                            ${this.escapeHtml(task.text)}
                        </span>
                        <button 
                            class="delete-btn" 
                            onclick="todoApp.deleteTask(${task.id})"
                            aria-label="タスクを削除"
                            title="タスクを削除"
                        >
                            🗑️
                        </button>
                    </div>
                `).join('');
            }

            // 空の状態の描画
            renderEmptyState() {
                let message, icon, description;
                
                switch (this.currentFilter) {
                    case 'active':
                        icon = '🎉';
                        message = 'すべてのタスクが完了しています！';
                        description = '新しいタスクを追加するか、「すべて」フィルターで確認してください。';
                        break;
                    case 'completed':
                        icon = '📝';
                        message = '完了したタスクがありません';
                        description = 'タスクを完了すると、ここに表示されます。';
                        break;
                    default:
                        icon = '✨';
                        message = 'タスクがありません';
                        description = '上の入力フィールドから新しいタスクを追加してください。';
                }

                this.todoList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${icon}</div>
                        <h3>${message}</h3>
                        <p>${description}</p>
                    </div>
                `;
            }

            // 統計情報の更新
            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(task => task.completed).length;
                const active = total - completed;

                this.totalCount.textContent = total;
                this.activeCount.textContent = active;
                this.completedCount.textContent = completed;

                // 完了済み削除ボタンの状態更新
                this.clearCompletedBtn.disabled = completed === 0;
            }

            // HTMLエスケープ
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // スクリーンリーダー用のお知らせ
            announceToScreenReader(message) {
                const announcement = document.createElement('div');
                announcement.setAttribute('aria-live', 'polite');
                announcement.setAttribute('aria-atomic', 'true');
                announcement.className = 'sr-only';
                announcement.textContent = message;
                
                document.body.appendChild(announcement);
                setTimeout(() => {
                    document.body.removeChild(announcement);
                }, 1000);
            }

            // ローカルストレージからタスクを読み込み
            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            // ローカルストレージにタスクを保存
            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                    alert('タスクの保存に失敗しました。ブラウザの容量を確認してください。');
                }
            }

            // 次のタスクIDを取得
            getNextId() {
                const maxId = this.tasks.reduce((max, task) => Math.max(max, task.id || 0), 0);
                return maxId + 1;
            }
        }

        // アプリケーションの初期化
        let todoApp;
        document.addEventListener('DOMContentLoaded', () => {
            todoApp = new TodoApp();
        });

        // エラーハンドリング
        window.addEventListener('error', (event) => {
            console.error('アプリケーションエラー:', event.error);
        });

        // ページ離脱時の確認（未保存の変更がある場合）
        window.addEventListener('beforeunload', (event) => {
            if (todoApp && todoApp.tasks.length > 0) {
                // モダンブラウザでは、このメッセージは表示されませんが、
                // 確認ダイアログは表示されます
                event.returnValue = '未保存のタスクがあります。本当にページを離れますか？';
            }
        });
    </script>
</body>
</html>
