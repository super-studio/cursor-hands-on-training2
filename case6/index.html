<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #6b7280;
            --hover-color: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .add-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .filter-section {
            padding: 0 1.5rem;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .filter-btn:hover:not(.active) {
            background: var(--hover-color);
            border-color: var(--primary-color);
        }

        .todo-list {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        .todo-item:hover {
            background-color: var(--hover-color);
        }

        .todo-item.completed {
            opacity: 0.7;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .todo-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .todo-date {
            font-size: 0.8rem;
            color: var(--completed-color);
            margin-right: 1rem;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.8;
        }

        .delete-btn:hover {
            background: #dc2626;
            opacity: 1;
            transform: scale(1.05);
        }

        .stats-section {
            padding: 1.5rem;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats-info {
            font-size: 0.9rem;
            color: var(--completed-color);
        }

        .clear-completed-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-completed-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .clear-completed-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--completed-color);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        .todo-item.removing {
            animation: fadeOut 0.3s ease-out forwards;
        }

        /* レスポンシブデザイン */
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-container {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .stats-section {
                flex-direction: column;
                text-align: center;
            }

            .todo-item {
                padding: 0.75rem 1rem;
            }

            .todo-date {
                display: none;
            }
        }

        /* アクセシビリティ */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Simple Todo App</h1>
            <p>効率的にタスクを管理しましょう</p>
        </header>

        <section class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..." 
                    maxlength="100"
                    aria-label="新しいタスクを入力"
                >
                <button class="add-btn" aria-label="タスクを追加">
                    追加
                </button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </section>

        <main class="todo-list" role="main" aria-label="タスク一覧">
            <!-- タスクがここに動的に追加されます -->
        </main>

        <footer class="stats-section">
            <div class="stats-info">
                残り: <span class="remaining-count">0</span>件
            </div>
            <button class="clear-completed-btn" aria-label="完了したタスクを削除">
                完了済みを削除
            </button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.taskIdCounter = this.getNextId();
                
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.todoList = document.querySelector('.todo-list');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.remainingCount = document.querySelector('.remaining-count');
                this.clearCompletedBtn = document.querySelector('.clear-completed-btn');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 入力フィールドの監視
                this.taskInput.addEventListener('input', () => {
                    this.addBtn.disabled = !this.taskInput.value.trim();
                });

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompletedBtn.addEventListener('click', () => {
                    this.clearCompleted();
                });

                // キーボードアクセシビリティ
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'a':
                                e.preventDefault();
                                this.setFilter('all');
                                break;
                            case 'u':
                                e.preventDefault();
                                this.setFilter('active');
                                break;
                            case 'c':
                                e.preventDefault();
                                this.setFilter('completed');
                                break;
                        }
                    }
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.taskIdCounter++,
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.taskInput.value = '';
                this.addBtn.disabled = true;
                this.saveTasks();
                this.render();

                // アクセシビリティ: 追加を通知
                this.announceToScreenReader(`タスク「${text}」を追加しました`);
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();

                    // アクセシビリティ: 状態変更を通知
                    const status = task.completed ? '完了' : '未完了';
                    this.announceToScreenReader(`タスク「${task.text}」を${status}にしました`);
                }
            }

            deleteTask(id) {
                const taskIndex = this.tasks.findIndex(t => t.id === id);
                if (taskIndex > -1) {
                    const task = this.tasks[taskIndex];
                    const taskElement = document.querySelector(`[data-task-id="${id}"]`);
                    
                    if (taskElement) {
                        taskElement.classList.add('removing');
                        setTimeout(() => {
                            this.tasks.splice(taskIndex, 1);
                            this.saveTasks();
                            this.render();
                            this.announceToScreenReader(`タスク「${task.text}」を削除しました`);
                        }, 300);
                    }
                }
            }

            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルターボタンの状態更新
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });

                this.render();
            }

            clearCompleted() {
                const completedCount = this.tasks.filter(t => t.completed).length;
                if (completedCount === 0) return;

                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();

                this.announceToScreenReader(`${completedCount}件の完了済みタスクを削除しました`);
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                
                if (filteredTasks.length === 0) {
                    this.renderEmptyState();
                } else {
                    this.renderTasks(filteredTasks);
                }

                this.updateStats();
            }

            renderEmptyState() {
                const emptyMessages = {
                    all: { icon: '📝', title: 'タスクがありません', message: '新しいタスクを追加してみましょう' },
                    active: { icon: '✅', title: 'すべて完了しました！', message: '新しいタスクを追加するか、完了済みタスクを確認してみましょう' },
                    completed: { icon: '🎯', title: '完了したタスクがありません', message: 'タスクを完了させて進捗を確認しましょう' }
                };

                const message = emptyMessages[this.currentFilter];
                
                this.todoList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${message.icon}</div>
                        <h3>${message.title}</h3>
                        <p>${message.message}</p>
                    </div>
                `;
            }

            renderTasks(tasks) {
                this.todoList.innerHTML = tasks.map(task => `
                    <div class="todo-item ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
                        <input 
                            type="checkbox" 
                            class="todo-checkbox" 
                            ${task.completed ? 'checked' : ''}
                            onchange="todoApp.toggleTask(${task.id})"
                            aria-label="タスクの完了状態を切り替え"
                        >
                        <span class="todo-text">${this.escapeHtml(task.text)}</span>
                        <span class="todo-date">${this.formatDate(task.createdAt)}</span>
                        <button 
                            class="delete-btn" 
                            onclick="todoApp.deleteTask(${task.id})"
                            aria-label="タスクを削除"
                        >
                            削除
                        </button>
                    </div>
                `).join('');
            }

            updateStats() {
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);
                
                this.remainingCount.textContent = activeTasks.length;
                this.clearCompletedBtn.disabled = completedTasks.length === 0;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = now - date;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 0) {
                    return '今日';
                } else if (diffDays === 1) {
                    return '昨日';
                } else if (diffDays < 7) {
                    return `${diffDays}日前`;
                } else {
                    return date.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric' });
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            announceToScreenReader(message) {
                const announcement = document.createElement('div');
                announcement.setAttribute('aria-live', 'polite');
                announcement.setAttribute('aria-atomic', 'true');
                announcement.style.position = 'absolute';
                announcement.style.left = '-10000px';
                announcement.style.width = '1px';
                announcement.style.height = '1px';
                announcement.style.overflow = 'hidden';
                announcement.textContent = message;
                
                document.body.appendChild(announcement);
                setTimeout(() => document.body.removeChild(announcement), 1000);
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                    this.announceToScreenReader('タスクの保存に失敗しました');
                }
            }

            getNextId() {
                const maxId = this.tasks.reduce((max, task) => Math.max(max, task.id || 0), 0);
                return maxId + 1;
            }
        }

        // アプリケーション初期化
        let todoApp;
        document.addEventListener('DOMContentLoaded', () => {
            todoApp = new TodoApp();
        });

        // ページ離脱時の確認（未保存のデータがある場合）
        window.addEventListener('beforeunload', (e) => {
            if (todoApp && todoApp.tasks.length > 0) {
                const activeTasks = todoApp.tasks.filter(t => !t.completed).length;
                if (activeTasks > 0) {
                    e.preventDefault();
                    return e.returnValue = '未完了のタスクがあります。本当にページを離れますか？';
                }
            }
        });
    </script>
</body>
</html>
