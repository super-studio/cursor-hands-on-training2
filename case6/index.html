<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #10b981;
            --warning: #ef4444;
            --background: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .content {
            padding: 24px;
        }

        .input-section {
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #059669;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            background: #dc2626;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--background);
        }

        .btn-outline.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--background);
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .task-list {
            min-height: 200px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: white;
            transition: all 0.2s;
        }

        .task-item:hover {
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        .task-item.completed {
            background: #f0f9ff;
            border-color: var(--secondary);
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .task-checkbox.checked {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            line-height: 1.5;
            transition: all 0.2s;
        }

        .task-text.completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-meta {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 4px;
        }

        .task-delete {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--warning);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .task-delete:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--background);
        }

        /* レスポンシブデザイン */
        @media (max-width: 640px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .input-group {
                flex-direction: column;
            }

            .filter-section {
                justify-content: center;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .actions {
                flex-direction: column;
                gap: 12px;
            }
        }

        /* アニメーション */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-item {
            animation: fadeIn 0.3s ease-out;
        }

        /* ダークモード対応の準備 */
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0f172a;
                --text: #e2e8f0;
                --border: #334155;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Simple Todo App</h1>
            <p>シンプルで使いやすいタスク管理アプリ</p>
        </header>

        <main class="content">
            <!-- タスク入力セクション -->
            <section class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="新しいタスクを入力してください..."
                        maxlength="200"
                        aria-label="新しいタスク"
                    >
                    <button id="addButton" class="btn btn-primary" aria-label="タスクを追加">
                        ➕ 追加
                    </button>
                </div>
            </section>

            <!-- フィルターセクション -->
            <section class="filter-section">
                <button id="filterAll" class="btn btn-outline active" data-filter="all">
                    📋 すべて
                </button>
                <button id="filterActive" class="btn btn-outline" data-filter="active">
                    ⏳ 未完了
                </button>
                <button id="filterCompleted" class="btn btn-outline" data-filter="completed">
                    ✅ 完了済み
                </button>
            </section>

            <!-- 統計情報 -->
            <div class="stats">
                <span id="totalCount">全タスク: 0件</span>
                <span id="activeCount">未完了: 0件</span>
                <span id="completedCount">完了: 0件</span>
            </div>

            <!-- タスクリスト -->
            <section class="task-list" id="taskList" aria-label="タスクリスト">
                <div class="empty-state" id="emptyState">
                    <div class="icon">📝</div>
                    <h3>タスクがありません</h3>
                    <p>新しいタスクを追加して始めましょう！</p>
                </div>
            </section>
        </main>

        <!-- アクションバー -->
        <footer class="actions">
            <button id="clearCompleted" class="btn btn-warning" disabled>
                🗑️ 完了済みを削除
            </button>
            <button id="toggleAll" class="btn btn-secondary" disabled>
                🔄 すべて完了/未完了
            </button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.init();
            }

            init() {
                this.bindEvents();
                this.render();
                this.updateStats();
            }

            bindEvents() {
                // タスク入力
                const taskInput = document.getElementById('taskInput');
                const addButton = document.getElementById('addButton');

                addButton.addEventListener('click', () => this.addTask());
                taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
                taskInput.addEventListener('input', (e) => {
                    addButton.disabled = !e.target.value.trim();
                });

                // フィルター
                document.querySelectorAll('[data-filter]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // アクション
                document.getElementById('clearCompleted').addEventListener('click', () => {
                    this.clearCompleted();
                });
                document.getElementById('toggleAll').addEventListener('click', () => {
                    this.toggleAll();
                });

                // キーボードショートカット
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'a':
                                e.preventDefault();
                                this.toggleAll();
                                break;
                            case 'd':
                                e.preventDefault();
                                this.clearCompleted();
                                break;
                        }
                    }
                });
            }

            addTask() {
                const input = document.getElementById('taskInput');
                const text = input.value.trim();

                if (!text) {
                    this.showError('タスクを入力してください');
                    return;
                }

                if (text.length > 200) {
                    this.showError('タスクは200文字以内で入力してください');
                    return;
                }

                const task = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                input.value = '';
                document.getElementById('addButton').disabled = true;
                
                this.render();
                this.updateStats();
                
                // 成功フィードバック
                this.showSuccess('タスクが追加されました');
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                    this.updateStats();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
                this.updateStats();
                this.showSuccess('タスクが削除されました');
            }

            clearCompleted() {
                const completedCount = this.tasks.filter(t => t.completed).length;
                if (completedCount === 0) return;

                if (confirm(`完了済みの${completedCount}件のタスクを削除しますか？`)) {
                    this.tasks = this.tasks.filter(t => !t.completed);
                    this.saveTasks();
                    this.render();
                    this.updateStats();
                    this.showSuccess(`${completedCount}件のタスクが削除されました`);
                }
            }

            toggleAll() {
                const allCompleted = this.tasks.length > 0 && this.tasks.every(t => t.completed);
                this.tasks.forEach(task => {
                    task.completed = !allCompleted;
                });
                this.saveTasks();
                this.render();
                this.updateStats();
            }

            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルターボタンの状態を更新
                document.querySelectorAll('[data-filter]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                
                this.render();
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const taskList = document.getElementById('taskList');
                const emptyState = document.getElementById('emptyState');
                const filteredTasks = this.getFilteredTasks();

                if (filteredTasks.length === 0) {
                    emptyState.style.display = 'block';
                    taskList.innerHTML = '';
                    taskList.appendChild(emptyState);
                    return;
                }

                emptyState.style.display = 'none';
                taskList.innerHTML = filteredTasks.map(task => this.createTaskHTML(task)).join('');

                // イベントリスナーを再設定
                filteredTasks.forEach(task => {
                    const taskElement = document.querySelector(`[data-id="${task.id}"]`);
                    const checkbox = taskElement.querySelector('.task-checkbox');
                    const deleteBtn = taskElement.querySelector('.task-delete');

                    checkbox.addEventListener('click', () => this.toggleTask(task.id));
                    deleteBtn.addEventListener('click', () => this.deleteTask(task.id));
                });
            }

            createTaskHTML(task) {
                const createdDate = new Date(task.createdAt).toLocaleDateString('ja-JP', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                             role="checkbox" 
                             aria-checked="${task.completed}"
                             tabindex="0">
                            ${task.completed ? '✓' : ''}
                        </div>
                        <div class="task-content">
                            <div class="task-text ${task.completed ? 'completed' : ''}">${this.escapeHtml(task.text)}</div>
                            <div class="task-meta">作成日時: ${createdDate}</div>
                        </div>
                        <button class="task-delete" aria-label="タスクを削除" title="削除">×</button>
                    </div>
                `;
            }

            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(t => t.completed).length;
                const active = total - completed;

                document.getElementById('totalCount').textContent = `全タスク: ${total}件`;
                document.getElementById('activeCount').textContent = `未完了: ${active}件`;
                document.getElementById('completedCount').textContent = `完了: ${completed}件`;

                // アクションボタンの状態を更新
                document.getElementById('clearCompleted').disabled = completed === 0;
                document.getElementById('toggleAll').disabled = total === 0;
                
                const toggleAllBtn = document.getElementById('toggleAll');
                const allCompleted = total > 0 && active === 0;
                toggleAllBtn.textContent = allCompleted ? '🔄 すべて未完了にする' : '🔄 すべて完了にする';
            }

            loadTasks() {
                try {
                    const saved = localStorage.getItem('todoApp_tasks');
                    return saved ? JSON.parse(saved) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                    this.showError('タスクの保存に失敗しました。ストレージの容量を確認してください。');
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            showSuccess(message) {
                this.showToast(message, 'success');
            }

            showError(message) {
                this.showToast(message, 'error');
            }

            showToast(message, type = 'info') {
                // 既存のトーストを削除
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    existingToast.remove();
                }

                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 12px 24px;
                    background: ${type === 'error' ? 'var(--warning)' : 'var(--secondary)'};
                    color: white;
                    border-radius: var(--radius);
                    box-shadow: var(--shadow);
                    z-index: 1000;
                    animation: slideIn 0.3s ease-out;
                `;

                document.body.appendChild(toast);

                // 3秒後に自動削除
                setTimeout(() => {
                    toast.style.animation = 'slideOut 0.3s ease-in';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        // アプリケーションの初期化
        document.addEventListener('DOMContentLoaded', () => {
            window.todoApp = new TodoApp();
        });

        // トーストアニメーション用CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
