<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #64748b;
            --hover-color: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .input-section {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: var(--hover-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .task-list {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
            animation: slideIn 0.3s ease;
        }

        .task-item:hover {
            background: var(--hover-color);
        }

        .task-item.completed {
            opacity: 0.7;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            border-color: var(--primary-color);
        }

        .task-checkbox.checked {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            word-break: break-word;
            transition: all 0.2s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .delete-btn {
            padding: 6px 12px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .footer {
            padding: 20px 24px;
            background: var(--hover-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .task-count {
            font-size: 14px;
            color: var(--completed-color);
            font-weight: 500;
        }

        .clear-completed {
            padding: 8px 16px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-completed:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .clear-completed:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--completed-color);
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 8px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .input-section {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .task-item {
                padding: 12px 20px;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Simple Todo App</h1>
            <p>シンプルで使いやすいタスク管理アプリ</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input type="text" class="task-input" id="taskInput" placeholder="新しいタスクを入力してください..." maxlength="200">
                <button class="add-btn" id="addBtn">追加</button>
            </div>
            
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </div>

        <div class="task-list" id="taskList">
            <div class="empty-state" id="emptyState">
                <h3>タスクがありません</h3>
                <p>上の入力欄から新しいタスクを追加してください</p>
            </div>
        </div>

        <div class="footer">
            <div class="task-count" id="taskCount">残り: 0件</div>
            <button class="clear-completed" id="clearCompleted" disabled>完了済みを削除</button>
        </div>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.nextId = this.getNextId();
                
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.getElementById('taskInput');
                this.addBtn = document.getElementById('addBtn');
                this.taskList = document.getElementById('taskList');
                this.emptyState = document.getElementById('emptyState');
                this.taskCount = document.getElementById('taskCount');
                this.clearCompleted = document.getElementById('clearCompleted');
                this.filterBtns = document.querySelectorAll('.filter-btn');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompleted.addEventListener('click', () => this.clearCompletedTasks());

                // キーボードショートカット
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'Enter':
                                e.preventDefault();
                                this.addTask();
                                break;
                            case 'a':
                                e.preventDefault();
                                this.setFilter('all');
                                break;
                            case 'u':
                                e.preventDefault();
                                this.setFilter('active');
                                break;
                            case 'c':
                                e.preventDefault();
                                this.setFilter('completed');
                                break;
                        }
                    }
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.nextId++,
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.push(task);
                this.taskInput.value = '';
                this.saveTasks();
                this.render();
                
                // 入力フィールドにフォーカスを戻す
                this.taskInput.focus();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            clearCompletedTasks() {
                const completedCount = this.tasks.filter(t => t.completed).length;
                if (completedCount === 0) return;

                if (confirm(`${completedCount}件の完了済みタスクを削除しますか？`)) {
                    this.tasks = this.tasks.filter(t => !t.completed);
                    this.saveTasks();
                    this.render();
                }
            }

            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルターボタンの状態更新
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                
                this.render();
            }

            getFilteredTasks() {
                switch(this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                
                if (filteredTasks.length === 0) {
                    this.showEmptyState();
                } else {
                    this.renderTasks(filteredTasks);
                }
                
                this.updateTaskCount();
                this.updateClearButton();
            }

            showEmptyState() {
                let message = '';
                switch(this.currentFilter) {
                    case 'active':
                        message = this.tasks.length === 0 ? 
                            'タスクがありません' : '未完了のタスクがありません';
                        break;
                    case 'completed':
                        message = '完了済みのタスクがありません';
                        break;
                    default:
                        message = 'タスクがありません';
                }

                this.taskList.innerHTML = `
                    <div class="empty-state">
                        <h3>${message}</h3>
                        <p>${this.currentFilter === 'all' ? '上の入力欄から新しいタスクを追加してください' : '他のフィルターを試してください'}</p>
                    </div>
                `;
            }

            renderTasks(tasks) {
                this.taskList.innerHTML = tasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                        <div class="task-checkbox ${task.completed ? 'checked' : ''}" 
                             onclick="app.toggleTask(${task.id})"
                             tabindex="0"
                             role="checkbox"
                             aria-checked="${task.completed}"
                             onkeypress="if(event.key==='Enter') app.toggleTask(${task.id})">
                        </div>
                        <div class="task-text ${task.completed ? 'completed' : ''}"
                             onclick="app.toggleTask(${task.id})"
                             tabindex="0"
                             onkeypress="if(event.key==='Enter') app.toggleTask(${task.id})">
                            ${this.escapeHtml(task.text)}
                        </div>
                        <div class="task-actions">
                            <button class="delete-btn" 
                                    onclick="app.deleteTask(${task.id})"
                                    aria-label="タスクを削除">
                                削除
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            updateTaskCount() {
                const activeCount = this.tasks.filter(t => !t.completed).length;
                const totalCount = this.tasks.length;
                
                if (totalCount === 0) {
                    this.taskCount.textContent = 'タスクなし';
                } else {
                    this.taskCount.textContent = `残り: ${activeCount}件 / 全${totalCount}件`;
                }
            }

            updateClearButton() {
                const completedCount = this.tasks.filter(t => t.completed).length;
                this.clearCompleted.disabled = completedCount === 0;
                this.clearCompleted.textContent = completedCount > 0 ? 
                    `完了済みを削除 (${completedCount})` : '完了済みを削除';
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                    alert('タスクの保存に失敗しました。ブラウザの容量が不足している可能性があります。');
                }
            }

            getNextId() {
                return this.tasks.length > 0 ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // アプリケーション初期化
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new TodoApp();
        });

        // PWA対応（基本的なサービスワーカー登録）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // サービスワーカーは別途実装する場合に使用
            });
        }
    </script>
</body>
</html>
