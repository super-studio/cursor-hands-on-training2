<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .input-section {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .add-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary-color);
        }

        .tasks-section {
            padding: 0 24px;
            min-height: 200px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .delete-btn {
            padding: 8px 12px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .footer {
            padding: 24px;
            background: var(--background-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .task-count {
            color: var(--completed-color);
        }

        .clear-completed-btn {
            padding: 8px 16px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clear-completed-btn:hover {
            background: #059669;
        }

        .clear-completed-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--completed-color);
        }

        .empty-state img {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 8px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-section {
                padding: 20px;
            }

            .input-container {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .filter-section {
                flex-wrap: wrap;
            }

            .tasks-section {
                padding: 0 20px;
            }

            .footer {
                padding: 20px;
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Simple Todo App</h1>
            <p>タスクを効率的に管理しましょう</p>
        </header>

        <div class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..." 
                    maxlength="100"
                    aria-label="新しいタスクを入力"
                >
                <button class="add-btn" aria-label="タスクを追加">追加</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </div>

        <div class="tasks-section" id="tasks-container">
            <div class="empty-state">
                <div style="font-size: 3rem; margin-bottom: 16px;">📋</div>
                <p>タスクがありません</p>
                <p>上記の入力欄から新しいタスクを追加してください</p>
            </div>
        </div>

        <footer class="footer">
            <div class="task-count">
                残り: <span id="remaining-count">0</span>件
            </div>
            <button class="clear-completed-btn" disabled>
                完了済みを削除
            </button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.init();
            }

            init() {
                this.bindEvents();
                this.render();
            }

            bindEvents() {
                const taskInput = document.querySelector('.task-input');
                const addBtn = document.querySelector('.add-btn');
                const filterBtns = document.querySelectorAll('.filter-btn');
                const clearCompletedBtn = document.querySelector('.clear-completed-btn');

                // タスク追加
                addBtn.addEventListener('click', () => this.addTask());
                taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.addTask();
                    }
                });

                // 入力値の変化を監視
                taskInput.addEventListener('input', () => {
                    addBtn.disabled = !taskInput.value.trim();
                });

                // フィルター
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.setFilter(btn.dataset.filter);
                    });
                });

                // 完了済み削除
                clearCompletedBtn.addEventListener('click', () => {
                    this.clearCompleted();
                });
            }

            addTask() {
                const taskInput = document.querySelector('.task-input');
                const text = taskInput.value.trim();

                if (!text) return;

                const task = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                taskInput.value = '';
                document.querySelector('.add-btn').disabled = true;
                
                this.saveTasks();
                this.render();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルターボタンの状態更新
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });

                this.render();
            }

            clearCompleted() {
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const container = document.getElementById('tasks-container');
                const filteredTasks = this.getFilteredTasks();
                
                if (filteredTasks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 3rem; margin-bottom: 16px;">
                                ${this.currentFilter === 'completed' ? '✅' : 
                                  this.currentFilter === 'active' ? '📋' : '📋'}
                            </div>
                            <p>${this.getEmptyMessage()}</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = filteredTasks.map(task => `
                        <div class="task-item fade-in">
                            <input 
                                type="checkbox" 
                                class="task-checkbox" 
                                ${task.completed ? 'checked' : ''}
                                onchange="todoApp.toggleTask(${task.id})"
                                aria-label="タスクの完了状態を切り替え"
                            >
                            <span class="task-text ${task.completed ? 'completed' : ''}">
                                ${this.escapeHtml(task.text)}
                            </span>
                            <button 
                                class="delete-btn" 
                                onclick="todoApp.deleteTask(${task.id})"
                                aria-label="タスクを削除"
                            >
                                削除
                            </button>
                        </div>
                    `).join('');
                }

                this.updateFooter();
            }

            getEmptyMessage() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.length === 0 ? 
                            'タスクがありません' : 
                            'すべてのタスクが完了しています！';
                    case 'completed':
                        return '完了したタスクがありません';
                    default:
                        return 'タスクがありません<br>上記の入力欄から新しいタスクを追加してください';
                }
            }

            updateFooter() {
                const remainingCount = this.tasks.filter(t => !t.completed).length;
                const completedCount = this.tasks.filter(t => t.completed).length;
                
                document.getElementById('remaining-count').textContent = remainingCount;
                
                const clearBtn = document.querySelector('.clear-completed-btn');
                clearBtn.disabled = completedCount === 0;
                clearBtn.textContent = `完了済みを削除 (${completedCount})`;
            }

            loadTasks() {
                try {
                    const saved = localStorage.getItem('todoApp_tasks');
                    return saved ? JSON.parse(saved) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // アプリケーション初期化
        const todoApp = new TodoApp();

        // キーボードアクセシビリティの向上
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + Enter で新しいタスクを追加
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                document.querySelector('.task-input').focus();
            }
        });

        // ページ読み込み時にフォーカス
        window.addEventListener('load', () => {
            document.querySelector('.task-input').focus();
        });
    </script>
</body>
</html>
