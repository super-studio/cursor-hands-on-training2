<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #64748b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .add-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .filter-section {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .task-list {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .task-item:hover {
            background-color: #f1f5f9;
        }

        .task-item.completed {
            opacity: 0.7;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .task-date {
            font-size: 0.75rem;
            color: var(--completed-color);
            margin-right: 1rem;
        }

        .delete-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .footer {
            padding: 1.5rem;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .task-count {
            font-size: 0.875rem;
            color: var(--completed-color);
        }

        .clear-completed {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        .clear-completed:hover {
            background: #059669;
        }

        .clear-completed:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--completed-color);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* レスポンシブデザイン */
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-container {
                flex-direction: column;
            }

            .filter-section {
                justify-content: center;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }

            .task-item {
                padding: 0.75rem 1rem;
            }

            .task-date {
                display: none;
            }
        }

        /* アニメーション */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Simple Todo App</h1>
            <p>タスクを効率的に管理しよう</p>
        </div>

        <div class="input-section">
            <div class="input-container">
                <input
                    type="text"
                    class="task-input"
                    placeholder="新しいタスクを入力してください..."
                    maxlength="100"
                    aria-label="新しいタスク"
                >
                <button class="add-btn" aria-label="タスクを追加">追加</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </div>

        <div class="task-list" id="taskList">
            <div class="empty-state" id="emptyState">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>
                <p>タスクがありません</p>
                <p>上の入力欄から新しいタスクを追加してください</p>
            </div>
        </div>

        <div class="footer">
            <div class="task-count" id="taskCount">
                残り: 0件
            </div>
            <button class="clear-completed" id="clearCompleted" disabled>
                完了済みを削除
            </button>
        </div>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.taskIdCounter = this.getNextId();

                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.taskList = document.getElementById('taskList');
                this.emptyState = document.getElementById('emptyState');
                this.taskCount = document.getElementById('taskCount');
                this.clearCompleted = document.getElementById('clearCompleted');
                this.filterBtns = document.querySelectorAll('.filter-btn');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 入力値の変化を監視
                this.taskInput.addEventListener('input', () => {
                    this.addBtn.disabled = !this.taskInput.value.trim();
                });

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompleted.addEventListener('click', () => {
                    this.clearCompletedTasks();
                });

                // キーボードショートカット
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case '1':
                                e.preventDefault();
                                this.setFilter('all');
                                break;
                            case '2':
                                e.preventDefault();
                                this.setFilter('active');
                                break;
                            case '3':
                                e.preventDefault();
                                this.setFilter('completed');
                                break;
                        }
                    }
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.taskIdCounter++,
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.taskInput.value = '';
                this.addBtn.disabled = true;
                this.saveTasks();
                this.render();

                // フォーカスを入力欄に戻す
                this.taskInput.focus();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            clearCompletedTasks() {
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();
            }

            setFilter(filter) {
                this.currentFilter = filter;

                // フィルターボタンの状態更新
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });

                this.render();
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();

                // タスクリストの表示/非表示
                if (filteredTasks.length === 0) {
                    this.emptyState.style.display = 'block';
                    this.taskList.innerHTML = '';
                    this.taskList.appendChild(this.emptyState);
                } else {
                    this.emptyState.style.display = 'none';
                    this.renderTasks(filteredTasks);
                }

                // フッターの更新
                this.updateFooter();
            }

            renderTasks(tasks) {
                this.taskList.innerHTML = tasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                        <input
                            type="checkbox"
                            class="task-checkbox"
                            ${task.completed ? 'checked' : ''}
                            onchange="todoApp.toggleTask(${task.id})"
                            aria-label="タスクの完了状態を切り替え"
                        >
                        <span class="task-text">${this.escapeHtml(task.text)}</span>
                        <span class="task-date">${this.formatDate(task.createdAt)}</span>
                        <button
                            class="delete-btn"
                            onclick="todoApp.deleteTask(${task.id})"
                            aria-label="タスクを削除"
                        >削除</button>
                    </div>
                `).join('');
            }

            updateFooter() {
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);

                this.taskCount.textContent = `残り: ${activeTasks.length}件`;
                this.clearCompleted.disabled = completedTasks.length === 0;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = now - date;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 0) {
                    return '今日';
                } else if (diffDays === 1) {
                    return '昨日';
                } else if (diffDays < 7) {
                    return `${diffDays}日前`;
                } else {
                    return date.toLocaleDateString('ja-JP', {
                        month: 'short',
                        day: 'numeric'
                    });
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                    alert('タスクの保存に失敗しました。ブラウザの容量を確認してください。');
                }
            }

            getNextId() {
                const maxId = this.tasks.reduce((max, task) => Math.max(max, task.id || 0), 0);
                return maxId + 1;
            }
        }

        // アプリケーション初期化
        const todoApp = new TodoApp();

        // PWA対応（サービスワーカー登録）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 本格的なPWA実装時にサービスワーカーを登録
                console.log('Service Worker対応ブラウザです');
            });
        }
    </script>
</body>
</html>
