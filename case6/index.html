<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #64748b;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #6366f1 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .task-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .add-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-color);
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: var(--background-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .tasks-section {
            min-height: 200px;
        }

        .tasks-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
            animation: slideIn 0.3s ease;
        }

        .task-item:hover {
            background: var(--background-color);
        }

        .task-item.completed {
            opacity: 0.7;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .task-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            word-break: break-word;
        }

        .task-date {
            font-size: 0.75rem;
            color: var(--completed-color);
            margin-right: 1rem;
        }

        .delete-btn {
            padding: 0.5rem;
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-size: 1.125rem;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            transform: scale(1.1);
        }

        .footer {
            padding: 1.5rem;
            background: var(--background-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .task-count {
            font-size: 0.875rem;
            color: var(--completed-color);
        }

        .clear-completed-btn {
            padding: 0.5rem 1rem;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-completed-btn:hover {
            background: #dc2626;
        }

        .clear-completed-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--completed-color);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        .task-item.removing {
            animation: fadeOut 0.3s ease forwards;
        }

        @media (max-width: 640px) {
            body {
                padding: 0.5rem;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-section {
                padding: 1rem;
            }

            .input-container {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .filters {
                justify-content: center;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }

            .task-item {
                padding: 0.75rem 1rem;
            }

            .task-date {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Simple Todo App</h1>
            <p>シンプルで使いやすいタスク管理アプリ</p>
        </header>

        <section class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    id="taskInput" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..." 
                    maxlength="200"
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">追加</button>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </section>

        <section class="tasks-section">
            <ul id="tasksList" class="tasks-list"></ul>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📋</div>
                <p>タスクがありません</p>
                <p>上の入力欄から新しいタスクを追加してみましょう</p>
            </div>
        </section>

        <footer class="footer">
            <div class="task-count" id="taskCount">残り: 0件</div>
            <button id="clearCompletedBtn" class="clear-completed-btn" disabled>完了済みを削除</button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.nextId = this.getNextId();
                
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.getElementById('taskInput');
                this.addBtn = document.getElementById('addBtn');
                this.tasksList = document.getElementById('tasksList');
                this.emptyState = document.getElementById('emptyState');
                this.taskCount = document.getElementById('taskCount');
                this.clearCompletedBtn = document.getElementById('clearCompletedBtn');
                this.filterBtns = document.querySelectorAll('.filter-btn');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });
                this.taskInput.addEventListener('input', () => this.updateAddButton());

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => this.setFilter(e.target.dataset.filter));
                });

                // 完了済み削除
                this.clearCompletedBtn.addEventListener('click', () => this.clearCompleted());

                // キーボードショートカット
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'a':
                                e.preventDefault();
                                this.setFilter('all');
                                break;
                            case 'u':
                                e.preventDefault();
                                this.setFilter('active');
                                break;
                            case 'c':
                                e.preventDefault();
                                this.setFilter('completed');
                                break;
                        }
                    }
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.nextId++,
                    text: text,
                    completed: false,
                    createdAt: new Date()
                };

                this.tasks.unshift(task);
                this.taskInput.value = '';
                this.updateAddButton();
                this.saveTasks();
                this.render();
                
                // 追加後にフォーカスを戻す
                this.taskInput.focus();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                const taskElement = document.querySelector(`[data-id="${id}"]`);
                if (taskElement) {
                    taskElement.classList.add('removing');
                    setTimeout(() => {
                        this.tasks = this.tasks.filter(t => t.id !== id);
                        this.saveTasks();
                        this.render();
                    }, 300);
                }
            }

            setFilter(filter) {
                this.currentFilter = filter;
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.render();
            }

            clearCompleted() {
                this.tasks = this.tasks.filter(task => !task.completed);
                this.saveTasks();
                this.render();
            }

            getFilteredTasks() {
                switch(this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(task => !task.completed);
                    case 'completed':
                        return this.tasks.filter(task => task.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(task => !task.completed);
                const completedTasks = this.tasks.filter(task => task.completed);

                // タスクリストの更新
                if (filteredTasks.length === 0) {
                    this.tasksList.style.display = 'none';
                    this.emptyState.style.display = 'block';
                } else {
                    this.tasksList.style.display = 'block';
                    this.emptyState.style.display = 'none';
                    this.tasksList.innerHTML = filteredTasks.map(task => this.createTaskHTML(task)).join('');
                }

                // フッター情報の更新
                this.taskCount.textContent = `残り: ${activeTasks.length}件`;
                this.clearCompletedBtn.disabled = completedTasks.length === 0;
                
                // タスクイベントの再バインド
                this.bindTaskEvents();
            }

            createTaskHTML(task) {
                const date = new Date(task.createdAt).toLocaleDateString('ja-JP', {
                    month: 'short',
                    day: 'numeric'
                });

                return `
                    <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            ${task.completed ? 'checked' : ''}
                            data-id="${task.id}"
                        >
                        <span class="task-text">${this.escapeHtml(task.text)}</span>
                        <span class="task-date">${date}</span>
                        <button class="delete-btn" data-id="${task.id}" title="削除">🗑️</button>
                    </li>
                `;
            }

            bindTaskEvents() {
                // チェックボックス
                document.querySelectorAll('.task-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (e) => {
                        this.toggleTask(parseInt(e.target.dataset.id));
                    });
                });

                // 削除ボタン
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.deleteTask(parseInt(e.target.dataset.id));
                    });
                });
            }

            updateAddButton() {
                const hasText = this.taskInput.value.trim().length > 0;
                this.addBtn.disabled = !hasText;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    if (stored) {
                        const tasks = JSON.parse(stored);
                        // 日付オブジェクトを復元
                        return tasks.map(task => ({
                            ...task,
                            createdAt: new Date(task.createdAt)
                        }));
                    }
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                }
                return [];
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                    alert('タスクの保存に失敗しました。ストレージの容量を確認してください。');
                }
            }

            getNextId() {
                return this.tasks.length > 0 ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
            }
        }

        // アプリケーション初期化
        document.addEventListener('DOMContentLoaded', () => {
            new TodoApp();
        });

        // PWA対応のためのサービスワーカー登録（オプション）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // サービスワーカーファイルがある場合のみ登録
                // navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
