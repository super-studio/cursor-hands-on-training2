<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #64748b;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #1d4ed8);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .filter-section {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .filter-btn:hover {
            background: var(--background-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .todo-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .todo-item:hover {
            background: var(--background-color);
        }

        .todo-item.completed {
            opacity: 0.7;
        }

        .todo-checkbox {
            margin-right: 0.75rem;
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .todo-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .todo-date {
            font-size: 0.75rem;
            color: var(--completed-color);
            margin-right: 0.75rem;
        }

        .delete-btn {
            padding: 0.5rem;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .stats {
            padding: 1rem 1.5rem;
            background: var(--background-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--completed-color);
        }

        .clear-completed {
            padding: 0.5rem 1rem;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .clear-completed:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .clear-completed:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--completed-color);
        }

        .empty-state svg {
            width: 4rem;
            height: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-container {
                flex-direction: column;
            }

            .filter-section {
                flex-wrap: wrap;
            }

            .todo-item {
                padding: 0.75rem 1rem;
            }

            .stats {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Simple Todo App</h1>
            <p>シンプルで使いやすいタスク管理アプリ</p>
        </div>

        <div class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..."
                    maxlength="100"
                    aria-label="新しいタスクを入力"
                >
                <button class="add-btn" aria-label="タスクを追加">追加</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </div>

        <div class="todo-list" id="todoList">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <p>タスクがありません<br>上の入力欄から新しいタスクを追加してみましょう</p>
            </div>
        </div>

        <div class="stats">
            <span class="task-count">残りタスク: 0件</span>
            <button class="clear-completed" disabled>完了済みを削除</button>
        </div>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.nextId = this.getNextId();
                
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.todoList = document.getElementById('todoList');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.taskCount = document.querySelector('.task-count');
                this.clearCompleted = document.querySelector('.clear-completed');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 入力監視
                this.taskInput.addEventListener('input', () => {
                    this.addBtn.disabled = !this.taskInput.value.trim();
                });

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompleted.addEventListener('click', () => {
                    this.clearCompletedTasks();
                });

                // キーボードナビゲーション
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'a':
                                e.preventDefault();
                                this.taskInput.focus();
                                break;
                            case 'f':
                                e.preventDefault();
                                this.toggleFilter();
                                break;
                        }
                    }
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: this.nextId++,
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.taskInput.value = '';
                this.addBtn.disabled = true;
                this.saveTasks();
                this.render();

                // フォーカスを入力欄に戻す
                this.taskInput.focus();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            setFilter(filter) {
                this.currentFilter = filter;
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.render();
            }

            toggleFilter() {
                const filters = ['all', 'active', 'completed'];
                const currentIndex = filters.indexOf(this.currentFilter);
                const nextFilter = filters[(currentIndex + 1) % filters.length];
                this.setFilter(nextFilter);
            }

            clearCompletedTasks() {
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();
            }

            getFilteredTasks() {
                switch(this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = now - date;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 0) {
                    return '今日';
                } else if (diffDays === 1) {
                    return '昨日';
                } else if (diffDays < 7) {
                    return `${diffDays}日前`;
                } else {
                    return date.toLocaleDateString('ja-JP');
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);

                // タスクリスト表示
                if (filteredTasks.length === 0) {
                    this.todoList.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                            </svg>
                            <p>${this.getEmptyMessage()}</p>
                        </div>
                    `;
                } else {
                    this.todoList.innerHTML = filteredTasks.map(task => `
                        <div class="todo-item ${task.completed ? 'completed' : ''} fade-in">
                            <input 
                                type="checkbox" 
                                class="todo-checkbox"
                                ${task.completed ? 'checked' : ''}
                                onchange="todoApp.toggleTask(${task.id})"
                                aria-label="タスクを完了"
                            >
                            <span class="todo-text">${this.escapeHtml(task.text)}</span>
                            <span class="todo-date">${this.formatDate(task.createdAt)}</span>
                            <button 
                                class="delete-btn"
                                onclick="todoApp.deleteTask(${task.id})"
                                aria-label="タスクを削除"
                            >削除</button>
                        </div>
                    `).join('');
                }

                // 統計情報更新
                this.taskCount.textContent = `残りタスク: ${activeTasks.length}件`;
                this.clearCompleted.disabled = completedTasks.length === 0;
            }

            getEmptyMessage() {
                switch(this.currentFilter) {
                    case 'active':
                        return 'おめでとうございます！<br>すべてのタスクが完了しています';
                    case 'completed':
                        return '完了したタスクがありません<br>タスクを完了してみましょう';
                    default:
                        return 'タスクがありません<br>上の入力欄から新しいタスクを追加してみましょう';
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('Failed to load tasks:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('Failed to save tasks:', error);
                }
            }

            getNextId() {
                return this.tasks.length > 0 ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
            }
        }

        // アプリケーション初期化
        let todoApp;
        document.addEventListener('DOMContentLoaded', () => {
            todoApp = new TodoApp();
        });
    </script>
</body>
</html>
