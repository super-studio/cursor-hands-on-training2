<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #10b981;
            --danger: #ef4444;
            --background: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-section {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .add-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .filter-section {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .filter-btn:hover {
            background: var(--background);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tasks-section {
            padding: 24px;
            min-height: 200px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            background: white;
        }

        .task-item:hover {
            box-shadow: var(--shadow);
        }

        .task-item.completed {
            opacity: 0.7;
            background: #f1f5f9;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-btn {
            padding: 8px 12px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            background: var(--background);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .task-count {
            font-size: 14px;
            color: #64748b;
        }

        .clear-btn {
            padding: 8px 16px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clear-btn:hover {
            background: #059669;
        }

        .clear-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .empty-state p {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state small {
            font-size: 14px;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 8px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .input-section {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .tasks-section {
                padding: 20px;
            }

            .footer {
                padding: 16px 20px;
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Simple Todo App</h1>
            <p>シンプルなタスク管理アプリ</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input
                    type="text"
                    class="task-input"
                    placeholder="新しいタスクを入力してください..."
                    maxlength="100"
                    aria-label="新しいタスク"
                >
                <button class="add-btn" aria-label="タスクを追加">追加</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </div>

        <div class="tasks-section">
            <ul class="task-list"></ul>
            <div class="empty-state" style="display: none;">
                <p>📝 タスクがありません</p>
                <small>上の入力欄から新しいタスクを追加してください</small>
            </div>
        </div>

        <div class="footer">
            <div class="task-count">残り: <span class="count">0</span>件</div>
            <button class="clear-btn" disabled>完了済みタスクを削除</button>
        </div>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.initElements();
                this.bindEvents();
                this.render();
            }

            initElements() {
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.taskList = document.querySelector('.task-list');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.taskCount = document.querySelector('.count');
                this.clearBtn = document.querySelector('.clear-btn');
                this.emptyState = document.querySelector('.empty-state');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 入力フィールドの状態監視
                this.taskInput.addEventListener('input', () => {
                    this.addBtn.disabled = !this.taskInput.value.trim();
                });

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => this.setFilter(btn.dataset.filter));
                });

                // 完了済みタスク削除
                this.clearBtn.addEventListener('click', () => this.clearCompleted());
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.taskInput.value = '';
                this.addBtn.disabled = true;
                this.render();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            setFilter(filter) {
                this.currentFilter = filter;
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.render();
            }

            clearCompleted() {
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);

                // タスクリストの描画
                if (filteredTasks.length === 0) {
                    this.taskList.style.display = 'none';
                    this.emptyState.style.display = 'block';
                } else {
                    this.taskList.style.display = 'block';
                    this.emptyState.style.display = 'none';

                    this.taskList.innerHTML = filteredTasks.map(task => `
                        <li class="task-item ${task.completed ? 'completed' : ''}">
                            <input
                                type="checkbox"
                                class="task-checkbox"
                                ${task.completed ? 'checked' : ''}
                                onchange="app.toggleTask(${task.id})"
                                aria-label="タスクの完了状態を切り替え"
                            >
                            <span class="task-text ${task.completed ? 'completed' : ''}">${this.escapeHtml(task.text)}</span>
                            <button
                                class="delete-btn"
                                onclick="app.deleteTask(${task.id})"
                                aria-label="タスクを削除"
                            >削除</button>
                        </li>
                    `).join('');
                }

                // 統計の更新
                this.taskCount.textContent = activeTasks.length;
                this.clearBtn.disabled = completedTasks.length === 0;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                }
            }
        }

        // アプリケーション初期化
        const app = new TodoApp();

        // PWA風のインストールプロンプト（オプション）
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            // 後でインストールプロンプトを表示できるように保存
            window.deferredPrompt = e;
        });
    </script>
</body>
</html>
