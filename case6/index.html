<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #10b981;
            --warning: #ef4444;
            --background: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
            --completed: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 1rem;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: var(--white);
            padding: 2rem;
            text-align: center;
        }

        .app-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .app-subtitle {
            opacity: 0.9;
            font-size: 1rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .task-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
        }

        .filter-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .filter-btn:hover:not(.active) {
            background: var(--border);
        }

        .tasks-section {
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        .task-item:hover {
            background: #f8fafc;
        }

        .task-item.completed {
            opacity: 0.7;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            appearance: none;
            border: 2px solid var(--border);
            border-radius: 4px;
            position: relative;
            transition: all 0.2s;
        }

        .task-checkbox:checked {
            background: var(--secondary);
            border-color: var(--secondary);
        }

        .task-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: -2px;
            left: 2px;
            color: var(--white);
            font-size: 14px;
            font-weight: bold;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--completed);
        }

        .task-date {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-right: 1rem;
        }

        .delete-btn {
            background: var(--warning);
            color: var(--white);
            border: none;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.8;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .stats-section {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .clear-completed-btn {
            background: transparent;
            color: var(--warning);
            border: 1px solid var(--warning);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-completed-btn:hover {
            background: var(--warning);
            color: var(--white);
        }

        .clear-completed-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-completed-btn:disabled:hover {
            background: transparent;
            color: var(--warning);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        .task-item.removing {
            animation: fadeOut 0.3s ease-in forwards;
        }

        /* レスポンシブデザイン */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .app-title {
                font-size: 1.5rem;
            }

            .input-container {
                flex-direction: column;
            }

            .add-btn {
                padding: 0.75rem;
            }

            .filter-buttons {
                justify-content: stretch;
            }

            .filter-btn {
                flex: 1;
                text-align: center;
            }

            .stats-section {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }

        /* アクセシビリティ */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* フォーカス表示 */
        .task-checkbox:focus,
        .delete-btn:focus,
        .filter-btn:focus,
        .clear-completed-btn:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">📝 Simple Todo App</h1>
            <p class="app-subtitle">効率的なタスク管理を始めましょう</p>
        </header>

        <section class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力..."
                    maxlength="100"
                    aria-label="新しいタスクを入力"
                >
                <button class="add-btn" type="button">追加</button>
            </div>
        </section>

        <section class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">全て</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </section>

        <section class="tasks-section" id="tasks-container">
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <p>タスクがありません。<br>上の入力欄から新しいタスクを追加してください。</p>
            </div>
        </section>

        <footer class="stats-section">
            <span class="task-count">残り: 0件</span>
            <button class="clear-completed-btn" disabled>完了済みを削除</button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.initEventListeners();
                this.render();
            }

            // ローカルストレージからタスクを読み込み
            loadTasks() {
                try {
                    const stored = localStorage.getItem('todoApp_tasks');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            // ローカルストレージにタスクを保存
            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                }
            }

            // イベントリスナーの初期化
            initEventListeners() {
                const taskInput = document.querySelector('.task-input');
                const addBtn = document.querySelector('.add-btn');
                const filterBtns = document.querySelectorAll('.filter-btn');
                const clearCompletedBtn = document.querySelector('.clear-completed-btn');

                // タスク追加
                addBtn.addEventListener('click', () => this.addTask());
                taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.addTask();
                    }
                });

                // フィルタリング
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済みタスクの一括削除
                clearCompletedBtn.addEventListener('click', () => {
                    this.clearCompleted();
                });
            }

            // タスクを追加
            addTask() {
                const taskInput = document.querySelector('.task-input');
                const text = taskInput.value.trim();

                if (!text) {
                    taskInput.focus();
                    return;
                }

                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date()
                };

                this.tasks.unshift(newTask);
                taskInput.value = '';
                taskInput.focus();
                
                this.saveTasks();
                this.render();
            }

            // タスクの完了状態を切り替え
            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            // タスクを削除
            deleteTask(id) {
                const taskElement = document.querySelector(`[data-task-id="${id}"]`);
                if (taskElement) {
                    taskElement.classList.add('removing');
                    setTimeout(() => {
                        this.tasks = this.tasks.filter(t => t.id !== id);
                        this.saveTasks();
                        this.render();
                    }, 300);
                }
            }

            // フィルターを設定
            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルターボタンの状態更新
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });

                this.render();
            }

            // 完了済みタスクを一括削除
            clearCompleted() {
                const completedTasks = this.tasks.filter(t => t.completed);
                if (completedTasks.length === 0) return;

                // アニメーション付きで削除
                completedTasks.forEach(task => {
                    const taskElement = document.querySelector(`[data-task-id="${task.id}"]`);
                    if (taskElement) {
                        taskElement.classList.add('removing');
                    }
                });

                setTimeout(() => {
                    this.tasks = this.tasks.filter(t => !t.completed);
                    this.saveTasks();
                    this.render();
                }, 300);
            }

            // フィルタリングされたタスクを取得
            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            // 日付をフォーマット
            formatDate(date) {
                const d = new Date(date);
                const today = new Date();
                const isToday = d.toDateString() === today.toDateString();
                
                if (isToday) {
                    return d.toLocaleTimeString('ja-JP', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                } else {
                    return d.toLocaleDateString('ja-JP', { 
                        month: 'short', 
                        day: 'numeric' 
                    });
                }
            }

            // タスクリストを描画
            render() {
                const container = document.getElementById('tasks-container');
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);

                // 統計情報を更新
                document.querySelector('.task-count').textContent = `残り: ${activeTasks.length}件`;
                const clearBtn = document.querySelector('.clear-completed-btn');
                clearBtn.disabled = completedTasks.length === 0;

                // タスクリストが空の場合
                if (filteredTasks.length === 0) {
                    const emptyMessage = this.currentFilter === 'all' 
                        ? 'タスクがありません。<br>上の入力欄から新しいタスクを追加してください。'
                        : this.currentFilter === 'active'
                        ? '未完了のタスクがありません。<br>素晴らしい！全てのタスクが完了しています。'
                        : '完了済みのタスクがありません。';

                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                ${this.currentFilter === 'active' ? '🎉' : '📋'}
                            </div>
                            <p>${emptyMessage}</p>
                        </div>
                    `;
                    return;
                }

                // タスクリストを描画
                container.innerHTML = filteredTasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''}" data-task-id="${task.id}">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            ${task.completed ? 'checked' : ''}
                            aria-label="タスクを完了"
                        >
                        <span class="task-text">${this.escapeHtml(task.text)}</span>
                        <span class="task-date">${this.formatDate(task.createdAt)}</span>
                        <button class="delete-btn" aria-label="タスクを削除">削除</button>
                    </div>
                `).join('');

                // イベントリスナーを再設定
                this.attachTaskEventListeners();
            }

            // タスク項目のイベントリスナーを設定
            attachTaskEventListeners() {
                const taskItems = document.querySelectorAll('.task-item');
                
                taskItems.forEach(item => {
                    const checkbox = item.querySelector('.task-checkbox');
                    const deleteBtn = item.querySelector('.delete-btn');
                    const taskId = parseInt(item.dataset.taskId);

                    checkbox.addEventListener('change', () => {
                        this.toggleTask(taskId);
                    });

                    deleteBtn.addEventListener('click', () => {
                        this.deleteTask(taskId);
                    });
                });
            }

            // HTMLエスケープ
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // アプリケーションを初期化
        document.addEventListener('DOMContentLoaded', () => {
            new TodoApp();
        });

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            // Ctrl+Enter で新しいタスクにフォーカス
            if (e.ctrlKey && e.key === 'Enter') {
                document.querySelector('.task-input').focus();
            }
        });
    </script>
</body>
</html>
