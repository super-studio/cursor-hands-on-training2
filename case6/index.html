<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #10b981;
            --danger: #ef4444;
            --background: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
        }

        .todo-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .todo-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filters {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .todo-list {
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.2s ease;
        }

        .todo-item:hover {
            background: #f8fafc;
        }

        .todo-item.completed {
            opacity: 0.7;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: var(--secondary);
        }

        .todo-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: var(--text-light);
        }

        .delete-btn {
            padding: 0.5rem 0.75rem;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .footer {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .clear-completed {
            padding: 0.5rem 1rem;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .clear-completed:hover {
            background: #dc2626;
        }

        .clear-completed:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            
            .container {
                border-radius: 8px;
            }
            
            .header {
                padding: 1.5rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .filters {
                justify-content: center;
            }
            
            .footer {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }

        /* アニメーション */
        .todo-item {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Simple Todo App</h1>
            <p>効率的にタスクを管理しましょう</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    class="todo-input" 
                    placeholder="新しいタスクを入力してください..."
                    id="todoInput"
                    autocomplete="off"
                >
                <button class="add-btn" onclick="addTodo()">追加</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterTodos('all')">全て</button>
            <button class="filter-btn" onclick="filterTodos('active')">未完了</button>
            <button class="filter-btn" onclick="filterTodos('completed')">完了済み</button>
        </div>

        <div class="todo-list" id="todoList">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">✨</div>
                <p>タスクがありません</p>
                <p>上の入力フィールドから新しいタスクを追加してください</p>
            </div>
        </div>

        <div class="footer">
            <span id="todoCount">0 件のタスク</span>
            <button class="clear-completed" onclick="clearCompleted()" id="clearBtn" disabled>
                完了済みを削除
            </button>
        </div>
    </div>

    <script>
        // グローバル変数
        let todos = [];
        let currentFilter = 'all';
        let nextId = 1;

        // DOM要素の取得
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const todoCount = document.getElementById('todoCount');
        const clearBtn = document.getElementById('clearBtn');

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadTodos();
            renderTodos();
            updateUI();
            
            // Enterキーでタスク追加
            todoInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTodo();
                }
            });
        });

        // ローカルストレージからタスクを読み込み
        function loadTodos() {
            try {
                const savedTodos = localStorage.getItem('todoApp_tasks');
                if (savedTodos) {
                    todos = JSON.parse(savedTodos);
                    nextId = Math.max(...todos.map(t => t.id), 0) + 1;
                }
            } catch (error) {
                console.error('データの読み込みに失敗しました:', error);
                todos = [];
            }
        }

        // ローカルストレージにタスクを保存
        function saveTodos() {
            try {
                localStorage.setItem('todoApp_tasks', JSON.stringify(todos));
            } catch (error) {
                console.error('データの保存に失敗しました:', error);
            }
        }

        // タスクを追加
        function addTodo() {
            const text = todoInput.value.trim();
            
            if (text === '') {
                todoInput.focus();
                return;
            }

            const newTodo = {
                id: nextId++,
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            todoInput.value = '';
            
            saveTodos();
            renderTodos();
            updateUI();
            todoInput.focus();
        }

        // タスクを削除
        function deleteTodo(id) {
            const todoElement = document.querySelector(`[data-id="${id}"]`);
            
            if (todoElement) {
                todoElement.classList.add('fade-out');
                setTimeout(() => {
                    todos = todos.filter(todo => todo.id !== id);
                    saveTodos();
                    renderTodos();
                    updateUI();
                }, 300);
            }
        }

        // タスクの完了状態を切り替え
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
                updateUI();
            }
        }

        // 完了済みタスクを全削除
        function clearCompleted() {
            const completedItems = document.querySelectorAll('.todo-item.completed');
            
            completedItems.forEach(item => {
                item.classList.add('fade-out');
            });

            setTimeout(() => {
                todos = todos.filter(todo => !todo.completed);
                saveTodos();
                renderTodos();
                updateUI();
            }, 300);
        }

        // フィルターを変更
        function filterTodos(filter) {
            currentFilter = filter;
            
            // フィルターボタンのアクティブ状態を更新
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTodos();
        }

        // タスクをレンダリング
        function renderTodos() {
            const filteredTodos = getFilteredTodos();
            
            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${getEmptyStateIcon()}</div>
                        <p>${getEmptyStateMessage()}</p>
                    </div>
                `;
                return;
            }

            todoList.innerHTML = filteredTodos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})"
                    >
                    <span class="todo-text ${todo.completed ? 'completed' : ''}">${escapeHtml(todo.text)}</span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">削除</button>
                </div>
            `).join('');
        }

        // フィルターされたタスクを取得
        function getFilteredTodos() {
            switch (currentFilter) {
                case 'active':
                    return todos.filter(todo => !todo.completed);
                case 'completed':
                    return todos.filter(todo => todo.completed);
                default:
                    return todos;
            }
        }

        // 空の状態のアイコンを取得
        function getEmptyStateIcon() {
            switch (currentFilter) {
                case 'active':
                    return '🎯';
                case 'completed':
                    return '🎉';
                default:
                    return '✨';
            }
        }

        // 空の状態のメッセージを取得
        function getEmptyStateMessage() {
            switch (currentFilter) {
                case 'active':
                    return '未完了のタスクはありません！';
                case 'completed':
                    return '完了済みのタスクはありません';
                default:
                    return 'タスクがありません<br>上の入力フィールドから新しいタスクを追加してください';
            }
        }

        // UIを更新
        function updateUI() {
            const activeTodos = todos.filter(todo => !todo.completed);
            const completedTodos = todos.filter(todo => todo.completed);
            
            // タスク数を更新
            const count = activeTodos.length;
            todoCount.textContent = `${count} 件のタスク`;
            
            // 完了済み削除ボタンの状態を更新
            clearBtn.disabled = completedTodos.length === 0;
        }

        // HTMLエスケープ
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // キーボードショートカット
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + Enter で最初の未完了タスクを完了
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const firstActiveTodo = todos.find(todo => !todo.completed);
                if (firstActiveTodo) {
                    toggleTodo(firstActiveTodo.id);
                }
            }
        });

        // サービスワーカーの登録（オフライン対応の準備）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // 将来的にサービスワーカーを追加する場合の準備
            });
        }
    </script>
</body>
</html>
