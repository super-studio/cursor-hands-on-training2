<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #64748b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #1d4ed8);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tasks-section {
            min-height: 300px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
            animation: slideIn 0.3s ease;
        }

        .task-item:hover {
            background-color: #f1f5f9;
        }

        .task-item.completed {
            opacity: 0.7;
        }

        .task-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .task-date {
            font-size: 0.75rem;
            color: var(--completed-color);
            margin-right: 1rem;
        }

        .delete-btn {
            padding: 0.5rem;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .footer {
            padding: 1.5rem;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .task-count {
            font-size: 0.875rem;
            color: var(--completed-color);
        }

        .clear-completed-btn {
            padding: 0.5rem 1rem;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-completed-btn:hover {
            background: #dc2626;
        }

        .clear-completed-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--completed-color);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }

        .task-item.removing {
            animation: fadeOut 0.3s ease forwards;
        }

        /* レスポンシブデザイン */
        @media (max-width: 640px) {
            body {
                padding: 0.5rem;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .input-section {
                padding: 1rem;
            }

            .input-container {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .task-item {
                padding: 0.75rem 1rem;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }
        }

        /* アクセシビリティ */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* フォーカス表示の改善 */
        .task-checkbox:focus,
        .delete-btn:focus,
        .filter-btn:focus,
        .clear-completed-btn:focus {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 Simple Todo App</h1>
            <p>シンプルで使いやすいタスク管理アプリ</p>
        </header>

        <section class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..." 
                    maxlength="100"
                    aria-label="新しいタスクの入力"
                >
                <button class="add-btn" aria-label="タスクを追加">
                    追加
                </button>
            </div>
            
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </section>

        <section class="tasks-section">
            <ul class="task-list" role="list">
                <!-- タスクがここに動的に追加されます -->
            </ul>
            <div class="empty-state" style="display: none;">
                <div class="empty-state-icon">📋</div>
                <p>タスクがありません</p>
                <p>上の入力欄から新しいタスクを追加してください</p>
            </div>
        </section>

        <footer class="footer">
            <div class="task-count">
                残り: <span class="remaining-count">0</span>件
            </div>
            <button class="clear-completed-btn" disabled>
                完了済みを削除
            </button>
        </footer>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.nextId = this.getNextId();
                
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.querySelector('.task-input');
                this.addBtn = document.querySelector('.add-btn');
                this.taskList = document.querySelector('.task-list');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.remainingCount = document.querySelector('.remaining-count');
                this.clearCompletedBtn = document.querySelector('.clear-completed-btn');
                this.emptyState = document.querySelector('.empty-state');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // フィルタリング
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompletedBtn.addEventListener('click', () => {
                    this.clearCompleted();
                });

                // キーボードショートカット
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'a':
                                e.preventDefault();
                                this.setFilter('all');
                                break;
                            case 'u':
                                e.preventDefault();
                                this.setFilter('active');
                                break;
                            case 'c':
                                e.preventDefault();
                                this.setFilter('completed');
                                break;
                        }
                    }
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                
                if (!text) {
                    this.taskInput.focus();
                    return;
                }

                const task = {
                    id: this.nextId++,
                    text: text,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                this.tasks.unshift(task);
                this.taskInput.value = '';
                this.saveTasks();
                this.render();
                this.taskInput.focus();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                const taskElement = document.querySelector(`[data-id="${id}"]`);
                if (taskElement) {
                    taskElement.classList.add('removing');
                    setTimeout(() => {
                        this.tasks = this.tasks.filter(t => t.id !== id);
                        this.saveTasks();
                        this.render();
                    }, 300);
                }
            }

            setFilter(filter) {
                this.currentFilter = filter;
                
                // フィルタボタンの状態更新
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                
                this.render();
            }

            clearCompleted() {
                const completedTasks = this.tasks.filter(t => t.completed);
                
                if (completedTasks.length === 0) return;

                // アニメーション付きで削除
                completedTasks.forEach(task => {
                    const taskElement = document.querySelector(`[data-id="${task.id}"]`);
                    if (taskElement) {
                        taskElement.classList.add('removing');
                    }
                });

                setTimeout(() => {
                    this.tasks = this.tasks.filter(t => !t.completed);
                    this.saveTasks();
                    this.render();
                }, 300);
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);

                // タスクリストの更新
                this.taskList.innerHTML = '';
                
                if (filteredTasks.length === 0) {
                    this.emptyState.style.display = 'block';
                } else {
                    this.emptyState.style.display = 'none';
                    
                    filteredTasks.forEach(task => {
                        const taskElement = this.createTaskElement(task);
                        this.taskList.appendChild(taskElement);
                    });
                }

                // カウンターの更新
                this.remainingCount.textContent = activeTasks.length;

                // 完了済み削除ボタンの状態
                this.clearCompletedBtn.disabled = completedTasks.length === 0;
            }

            createTaskElement(task) {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.setAttribute('data-id', task.id);
                li.setAttribute('role', 'listitem');

                const date = new Date(task.createdAt).toLocaleDateString('ja-JP', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                li.innerHTML = `
                    <input 
                        type="checkbox" 
                        class="task-checkbox" 
                        ${task.completed ? 'checked' : ''}
                        aria-label="タスクの完了状態を切り替え"
                    >
                    <span class="task-text">${this.escapeHtml(task.text)}</span>
                    <span class="task-date">${date}</span>
                    <button class="delete-btn" aria-label="タスクを削除">
                        削除
                    </button>
                `;

                // イベントリスナーの追加
                const checkbox = li.querySelector('.task-checkbox');
                const deleteBtn = li.querySelector('.delete-btn');

                checkbox.addEventListener('change', () => {
                    this.toggleTask(task.id);
                });

                deleteBtn.addEventListener('click', () => {
                    this.deleteTask(task.id);
                });

                return li;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                }
            }

            loadTasks() {
                try {
                    const saved = localStorage.getItem('todoApp_tasks');
                    return saved ? JSON.parse(saved) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            getNextId() {
                return this.tasks.length > 0 ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
            }
        }

        // アプリケーションの初期化
        document.addEventListener('DOMContentLoaded', () => {
            new TodoApp();
        });

        // サービスワーカーの登録（オフライン対応）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 本格的なPWA化が必要な場合のみ実装
                console.log('Service Worker対応ブラウザです');
            });
        }
    </script>
</body>
</html>
