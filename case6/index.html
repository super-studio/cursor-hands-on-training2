<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo App</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #10b981;
            --warning-color: #ef4444;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --completed-color: #64748b;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .app-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .app-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .app-subtitle {
            color: var(--completed-color);
            font-size: 1.1rem;
        }

        .input-section {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
        }

        .task-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .add-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .add-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .filter-section {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            background: white;
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tasks-section {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .tasks-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .tasks-list {
            min-height: 200px;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background-color: #f1f5f9;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 1rem;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--completed-color);
        }

        .task-date {
            font-size: 0.8rem;
            color: var(--completed-color);
            margin-right: 1rem;
        }

        .delete-btn {
            padding: 0.5rem 0.75rem;
            background: var(--warning-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--completed-color);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .stats-section {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats-info {
            font-size: 0.9rem;
            color: var(--completed-color);
        }

        .clear-completed-btn {
            padding: 0.5rem 1rem;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .clear-completed-btn:hover {
            background: #059669;
        }

        .clear-completed-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 640px) {
            .container {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }

            .app-title {
                font-size: 2rem;
            }

            .input-container {
                flex-direction: column;
            }

            .filter-buttons {
                justify-content: center;
            }

            .stats-section {
                flex-direction: column;
                text-align: center;
            }

            .task-item {
                padding: 0.75rem 1rem;
            }

            .task-date {
                display: none;
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">📝 Todo App</h1>
            <p class="app-subtitle">シンプルで使いやすいタスク管理</p>
        </header>

        <section class="input-section">
            <div class="input-container">
                <input 
                    type="text" 
                    id="taskInput" 
                    class="task-input" 
                    placeholder="新しいタスクを入力してください..."
                    maxlength="100"
                >
                <button id="addBtn" class="add-btn">追加</button>
            </div>
        </section>

        <section class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">すべて</button>
                <button class="filter-btn" data-filter="active">未完了</button>
                <button class="filter-btn" data-filter="completed">完了済み</button>
            </div>
        </section>

        <section class="tasks-section">
            <div class="tasks-header">
                <span id="tasksHeader">タスク一覧</span>
            </div>
            <div id="tasksList" class="tasks-list">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>タスクがありません。<br>上の入力欄から新しいタスクを追加してください。</p>
                </div>
            </div>
        </section>

        <section class="stats-section">
            <div class="stats-info">
                <span id="statsText">残り: 0件</span>
            </div>
            <button id="clearCompletedBtn" class="clear-completed-btn" disabled>
                完了済みを削除
            </button>
        </section>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.initializeElements();
                this.bindEvents();
                this.render();
            }

            initializeElements() {
                this.taskInput = document.getElementById('taskInput');
                this.addBtn = document.getElementById('addBtn');
                this.tasksList = document.getElementById('tasksList');
                this.filterBtns = document.querySelectorAll('.filter-btn');
                this.clearCompletedBtn = document.getElementById('clearCompletedBtn');
                this.statsText = document.getElementById('statsText');
                this.tasksHeader = document.getElementById('tasksHeader');
            }

            bindEvents() {
                // タスク追加
                this.addBtn.addEventListener('click', () => this.addTask());
                this.taskInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // 入力フィールドの監視
                this.taskInput.addEventListener('input', () => {
                    this.addBtn.disabled = this.taskInput.value.trim() === '';
                });

                // フィルター
                this.filterBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setFilter(e.target.dataset.filter);
                    });
                });

                // 完了済み削除
                this.clearCompletedBtn.addEventListener('click', () => {
                    this.clearCompleted();
                });
            }

            addTask() {
                const text = this.taskInput.value.trim();
                if (!text) return;

                const task = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date()
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.taskInput.value = '';
                this.addBtn.disabled = true;
                this.render();
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            deleteTask(id) {
                this.tasks = this.tasks.filter(t => t.id !== id);
                this.saveTasks();
                this.render();
            }

            setFilter(filter) {
                this.currentFilter = filter;
                this.filterBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.render();
            }

            clearCompleted() {
                this.tasks = this.tasks.filter(t => !t.completed);
                this.saveTasks();
                this.render();
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.tasks.filter(t => !t.completed);
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    default:
                        return this.tasks;
                }
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const activeTasks = this.tasks.filter(t => !t.completed);
                const completedTasks = this.tasks.filter(t => t.completed);

                // タスクリストの描画
                if (filteredTasks.length === 0) {
                    this.tasksList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>${this.getEmptyMessage()}</p>
                        </div>
                    `;
                } else {
                    this.tasksList.innerHTML = filteredTasks.map(task => `
                        <div class="task-item fade-in">
                            <input 
                                type="checkbox" 
                                class="task-checkbox" 
                                ${task.completed ? 'checked' : ''}
                                onchange="app.toggleTask(${task.id})"
                            >
                            <span class="task-text ${task.completed ? 'completed' : ''}">
                                ${this.escapeHtml(task.text)}
                            </span>
                            <span class="task-date">
                                ${this.formatDate(task.createdAt)}
                            </span>
                            <button 
                                class="delete-btn" 
                                onclick="app.deleteTask(${task.id})"
                                aria-label="タスクを削除"
                            >
                                削除
                            </button>
                        </div>
                    `).join('');
                }

                // 統計情報の更新
                this.statsText.textContent = `残り: ${activeTasks.length}件`;
                
                // ヘッダーの更新
                const filterText = {
                    all: 'すべてのタスク',
                    active: '未完了のタスク',
                    completed: '完了済みのタスク'
                };
                this.tasksHeader.textContent = `${filterText[this.currentFilter]} (${filteredTasks.length}件)`;

                // 完了済み削除ボタンの状態
                this.clearCompletedBtn.disabled = completedTasks.length === 0;
            }

            getEmptyMessage() {
                switch (this.currentFilter) {
                    case 'active':
                        return 'すべてのタスクが完了しています！🎉';
                    case 'completed':
                        return '完了したタスクがありません。';
                    default:
                        return 'タスクがありません。<br>上の入力欄から新しいタスクを追加してください。';
                }
            }

            formatDate(date) {
                const d = new Date(date);
                const now = new Date();
                const diff = now - d;
                const minutes = Math.floor(diff / (1000 * 60));
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));

                if (minutes < 1) return 'たった今';
                if (minutes < 60) return `${minutes}分前`;
                if (hours < 24) return `${hours}時間前`;
                if (days < 7) return `${days}日前`;
                
                return d.toLocaleDateString('ja-JP', {
                    month: 'short',
                    day: 'numeric'
                });
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            loadTasks() {
                try {
                    const saved = localStorage.getItem('todoApp_tasks');
                    return saved ? JSON.parse(saved) : [];
                } catch (error) {
                    console.error('タスクの読み込みに失敗しました:', error);
                    return [];
                }
            }

            saveTasks() {
                try {
                    localStorage.setItem('todoApp_tasks', JSON.stringify(this.tasks));
                } catch (error) {
                    console.error('タスクの保存に失敗しました:', error);
                }
            }
        }

        // アプリケーションの初期化
        const app = new TodoApp();

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + A で全選択を防止（タスクリスト内で）
            if ((e.ctrlKey || e.metaKey) && e.key === 'a' && e.target.closest('.tasks-list')) {
                e.preventDefault();
            }
        });

        // ページ離脱時の確認（未完了タスクがある場合）
        window.addEventListener('beforeunload', (e) => {
            const activeTasks = app.tasks.filter(t => !t.completed);
            if (activeTasks.length > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
