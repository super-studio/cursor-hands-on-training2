<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おいしい牛乳 - 自然の恵みをお届け</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        .hero {
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        
        .hero-content {
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .hero h1 {
            font-size: 3rem;
            color: #2c5aa0;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .hero .subtitle {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        
        .feature {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .feature:hover {
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .feature h3 {
            color: #2c5aa0;
            margin-bottom: 1rem;
        }
        
        .cta-button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            padding: 1rem 3rem;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .milk-image {
            width: 200px;
            height: 200px;
            background: #fff;
            border-radius: 50%;
            margin: 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero-content {
                padding: 2rem;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <div class="milk-image">🥛</div>
            <h1>おいしい牛乳</h1>
            <p class="subtitle">自然の恵みをそのままお届け</p>
            
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🌱</div>
                    <h3>自然放牧</h3>
                    <p>広大な牧場でのびのびと育った牛から搾った、新鮮で栄養豊富な牛乳です。</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">🏆</div>
                    <h3>品質保証</h3>
                    <p>厳格な品質管理のもと、安全で美味しい牛乳をお客様にお届けしています。</p>
                </div>
                
                <div class="feature">
                    <div class="feature-icon">💪</div>
                    <h3>栄養満点</h3>
                    <p>カルシウム、タンパク質、ビタミンが豊富で、健康的な毎日をサポートします。</p>
                </div>
            </div>
            
            <button class="cta-button" onclick="alert('ご注文ありがとうございます！')">
                今すぐ注文する
            </button>
        </div>
    </section>
</body>
</html>
